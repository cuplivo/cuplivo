name: Regenerate markdown goldens

# One-off maintenance job, not part of the gate.
#
# The `markdown_backdrop` baselines are pixel fixtures that only match the machine
# that produced them: measured on ubuntu-24.04 they differ by 1.4-2.2 %, and on
# Windows by 0.70-2.07 %, while `frosted_surface_golden_test.dart` — generated on
# this image — passes in both places. Running this job on the branch that needs
# them, downloading the artifact and copying it over
# `test/goldens/baselines/markdown_backdrop/` gives CI its own baselines.
#
# Use it, then delete the file: it is not a build workflow, and the re-base rule
# keeps `.github/workflows/release.yml` as the only one of those.
on:
  workflow_dispatch:

jobs:
  regen:
    name: Regenerate goldens on ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get --enforce-lockfile

      - name: Regenerate the markdown backdrop baselines
        run: flutter test --update-goldens test/goldens/markdown_backdrop_golden_test.dart

      - name: 📤 Upload the regenerated baselines
        uses: actions/upload-artifact@v4
        with:
          name: markdown-backdrop-baselines
          path: test/goldens/baselines/markdown_backdrop/
          if-no-files-found: error

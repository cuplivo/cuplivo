<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>子代理 · 提权访问</title>
<style>
  :root{
    --bg:#0b0c0f;--card:#15171c;--line:rgba(255,255,255,.08);
    --fg:#e8eaee;--muted:rgba(255,255,255,.52);--dim:rgba(255,255,255,.34);
    --primary:#7aa2ff;--warn:#e0a34a;--deny:#e06a6a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.55 -apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:26px 20px 48px}
  .wrap{max-width:600px;margin:0 auto}
  h1{font-size:17px;font-weight:600;margin:0 0 18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .card + .card{margin-top:14px}
  .srow{display:flex;align-items:center;gap:10px;padding:11px 2px;font-size:13.5px}
  .srow + .srow{border-top:1px solid var(--line)}
  .srow .t{flex:1}
  .srow .val{color:var(--muted);font-size:13px}
  .srow .chev{color:var(--dim);font-size:12px}
  .srow.sel .t{color:var(--primary)}
  .srow .tick{color:var(--primary);font-size:12px}
  .ic{width:22px;text-align:center;font-size:15px;line-height:1}
  .ic.q{color:var(--muted)}.ic.d{color:var(--deny)}.ic.a{color:var(--warn)}
  .cap{color:var(--muted);font-size:12px;margin:10px 0 0}
  .cap b{color:var(--fg);font-weight:600}
</style>
</head>
<body>
<div class="wrap">

<h1>子代理 · 提权访问</h1>

<div class="card">
  <div class="srow"><span class="t">开启</span><span class="val">开</span></div>
  <div class="srow"><span class="t">深度</span><span class="val">1</span></div>
  <div class="srow"><span class="t">模型</span><span class="val">继承本助手</span><span class="chev">›</span></div>
  <div class="srow">
    <span class="ic q">?</span><span class="t">子代理提权访问</span>
    <span class="val">询问</span><span class="chev">›</span>
  </div>
</div>

<div class="card">
  <div class="srow sel"><span class="ic q">?</span><span class="t">询问</span><span class="tick">✓</span></div>
  <div class="srow"><span class="ic d">⊘</span><span class="t">始终拒绝</span></div>
  <div class="srow"><span class="ic a">⚠</span><span class="t">始终允许</span></div>
</div>

<p class="cap"><b>询问</b> 默认。<b>始终允许</b> 以父会话为上限：父会话本身没给到这个权限时，退回询问。</p>

</div>
</body>
</html>

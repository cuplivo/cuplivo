name: PR Checks

env:
  FLUTTER_VERSION: '3.47.6'

on:
  pull_request:
    branches: [master]

jobs:
  checks:
    name: Analyze / Test / L10n / Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Dart format (changed files only)
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE_SHA="${{ github.event.pull_request.base.sha }}"
            HEAD_SHA="${{ github.sha }}"
          else
            BASE_SHA="${{ github.event.before }}"
            HEAD_SHA="${{ github.sha }}"
          fi

          files="$(git diff --diff-filter=ACMR --name-only "$BASE_SHA" "$HEAD_SHA" -- | grep -E '^(lib|test|integration_test)/.*\.dart$' || true)"
          if [ -z "$files" ]; then
            echo "No changed Dart files to format-check."
            exit 0
          fi

          echo "Format-checking files:"
          echo "$files"
          dart format --output=none --set-exit-if-changed $files

      - name: Generate l10n and ensure committed outputs
        run: |
          flutter gen-l10n
          git diff --exit-code -- lib/l10n

      - name: No new untranslated messages (PR)
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA='${{ github.event.pull_request.base.sha }}'
          BASE_DIR="$(mktemp -d)"
          cleanup() {
            git worktree remove --force "$BASE_DIR" >/dev/null 2>&1 || true
            rm -rf "$BASE_DIR" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          git worktree add --detach "$BASE_DIR" "$BASE_SHA"
          pushd "$BASE_DIR" >/dev/null
          flutter pub get
          flutter gen-l10n
          popd >/dev/null

          python3 .github/scripts/check_no_new_untranslated.py \
            "$BASE_DIR/desiredFileName.txt" \
            "desiredFileName.txt"

      - name: dart analyze (root package only)
        run: dart analyze --fatal-infos lib test integration_test

      - name: flutter test
        run: flutter test

  # The Dart gate above cannot see the native half of a change: nothing in that
  # job compiles Kotlin or Swift, so a broken `scheduled/` or `ios/Runner/` edit
  # used to reach a release build before anyone noticed. This job is the gate for
  # the Android half, and it runs the Kotlin unit tests that no other workflow
  # runs. iOS has no equivalent here (macOS runner plus the iSH sandbox
  # artifacts); it is verified by dispatching `release.yml` for the branch.
  #
  # `continue-on-error` keeps the job advisory for now: the repository has no
  # history of a green native gate yet, and a red one must not block the Dart
  # checks that used to be the whole contract. Tighten it once it has a track
  # record.
  native:
    name: Native (Android Kotlin compile + unit tests)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Did the native sources change?
        id: changed
        shell: bash
        run: |
          set -euo pipefail
          base='${{ github.event.pull_request.base.sha }}'
          if git diff --quiet "$base" HEAD -- android/ ios/; then
            echo "native=false" >> "$GITHUB_OUTPUT"
          else
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Java
        if: steps.changed.outputs.native == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter
        if: steps.changed.outputs.native == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Flutter pub get
        if: steps.changed.outputs.native == 'true'
        run: flutter pub get

      # `flutter build` owns the whole Android setup here: it writes
      # `android/local.properties` (`settings.gradle.kts` hard-requires
      # `flutter.sdk` from it) and it is the only entry point that knows where
      # the Gradle wrapper for this project lives. It compiles every Kotlin
      # source, including the release variant with the care alarm code, which is
      # the half no other workflow ever compiled.
      - name: Compile Android (Kotlin, release variant)
        if: steps.changed.outputs.native == 'true'
        run: flutter build apk --release

      # The Kotlin unit tests that cover the fire plan and the alarm handoff.
      # `flutter build apk` above is what materializes the wrapper.
      #
      # Scoped to the two care classes on purpose: the rest of
      # `android/app/src/test/` has never run under any workflow, and 52 of its
      # 249 tests fail on this baseline (`OAuthLifecycleTest`, and one
      # `HighRefreshRateControllerTest` initializer) for reasons unrelated to
      # care. Running the whole suite here would turn this gate red on
      # `master`'s own debt; run it unfiltered while fixing that.
      - name: Android Kotlin unit tests (proactive care)
        if: steps.changed.outputs.native == 'true'
        working-directory: android
        run: |
          ./gradlew :app:testReleaseUnitTest --no-daemon \
            --tests 'com.cuplivo.cuplivo.scheduled.ProactiveCareAlarmsTest' \
            --tests 'com.cuplivo.cuplivo.scheduled.ProactiveCareFirePlanTest'

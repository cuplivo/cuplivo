name: Flutter Multi-Platform Build Stable 3.44

env:
  FLUTTER_VERSION: '3.44.1'

on:
  workflow_dispatch:
    inputs:
      build_android:
        description: '构建 Android'
        required: false
        default: true
        type: boolean

      build_ios:
        description: '构建 iOS'
        required: false
        default: true
        type: boolean

      build_mac:
        description: '构建 macOS'
        required: false
        default: true
        type: boolean

      build_windows:
        description: '构建 Windows'
        required: false
        default: true
        type: boolean

      build_linux:
        description: '构建 Linux'
        required: false
        default: true
        type: boolean

      publish_release:
        description: '发布到 Release'
        required: false
        default: false
        type: boolean

      release_tag:
        description: 'Release 标签（如 v1.0.0）'
        required: false
        default: ''
        type: string

      prerelease:
        description: '是否为预发布版本 (Pre-release)'
        required: false
        default: false
        type: boolean

jobs:
  android:
    if: ${{ github.event.inputs.build_android == 'true' }}
    name: 构建 Android
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
      - name: 📦 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ 配置 Java 环境
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: 🐦 安装 Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: 📝 Inject fallback
        shell: bash
        run: |
          mkdir -p lib/secrets
          cat > lib/secrets/fallback.dart <<'EOF'
          const String siliconflowFallbackKey = '${{ secrets.SILICONFLOW_KEY }}';
          EOF

      - name: 📝 获取版本号
        id: version
        run: |
          VERSION=$(grep 'version:' pubspec.yaml | sed 's/version: //' | tr -d ' ')
          if [ "${{ github.event.inputs.publish_release }}" != "true" ]; then
            SHORT_SHA=$(git rev-parse --short HEAD)
            VERSION="${VERSION}_${SHORT_SHA}"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "版本号: $VERSION"

      - name: 🔑 写入签名密钥
        if: ${{ env.SIGN_KEYSTORE_BASE64 != '' }}
        env:
          SIGN_KEYSTORE_BASE64: ${{ secrets.SIGN_KEYSTORE_BASE64 }}
        run: |
          echo "$SIGN_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          echo "storeFile=key.jks" >> android/key.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> android/key.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> android/key.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> android/key.properties
          echo "✅ 签名配置已写入"

      - name: 🏗️ 构建 APK
        run: |
          if [ -f android/key.properties ]; then
            flutter build apk --release
          else
            echo "⚠️ 无签名密钥，使用 debug 签名构建"
            flutter build apk --debug
          fi

      - name: 📦 重命名 APK
        run: |
          cd build/app/outputs/flutter-apk
          if [ -f app-release.apk ]; then
            mv app-release.apk "Noxlivo_android_${VERSION}.apk"
          elif [ -f app-debug.apk ]; then
            mv app-debug.apk "Noxlivo_android_${VERSION}_debug.apk"
          fi

      - name: 📏 记录产物体积
        run: |
          {
            echo "### Android APK sizes"
            echo '```'
            ls -lh build/app/outputs/flutter-apk/Noxlivo_android_*.apk
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 📤 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK
          path: build/app/outputs/flutter-apk/Noxlivo_android_*.apk

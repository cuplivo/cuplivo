<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src data: blob: https:; font-src 'self' data:; frame-src 'none'; connect-src 'none'; object-src 'none'; form-action 'none'; base-uri 'none'; navigate-to 'none'" />
    <link rel="stylesheet" href="styles.css" />
    <script src="vendor/marked.min.js" defer></script>
    <script src="vendor/purify.min.js" defer></script>
    <script src="app.bundle.js" defer></script>
  </head>
  <body>
    <div id="chat-background" aria-hidden="true"></div>
    <main id="timeline" role="log" aria-live="polite" aria-relevant="additions text"></main>
    <div id="virtual-window-loader" role="status" aria-live="polite" hidden>
      <span class="virtual-window-spinner" aria-hidden="true"></span>
      <span id="virtual-window-loader-label" class="visually-hidden"></span>
    </div>
  </body>
</html>

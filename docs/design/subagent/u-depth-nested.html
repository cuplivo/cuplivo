<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>深度 · 可调 1–3</title>
<style>
  :root{--bg:#0b0c0f;--card:#15171c;--line:rgba(255,255,255,.08);
    --fg:#e8eaee;--muted:rgba(255,255,255,.52);--dim:rgba(255,255,255,.34);--primary:#7aa2ff;--warn:#e0a34a}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
    font:14px/1.6 -apple-system,"Segoe UI",system-ui,"PingFang SC","Microsoft YaHei",sans-serif;
    padding:26px 20px 44px}
  .wrap{max-width:600px;margin:0 auto}
  h1{font-size:17px;font-weight:600;margin:0 0 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .card + .card{margin-top:12px}
  .srow{display:flex;align-items:center;gap:10px;padding:11px 2px;font-size:13.5px}
  .srow + .srow{border-top:1px solid var(--line)}
  .srow .t{flex:1}
  .srow .val{color:var(--muted);font-size:13px}
  .srow .chev{color:var(--dim);font-size:12px}
  .srow .sub{color:var(--muted);font-size:11.5px;margin-top:1px}
  .srow.sel .t{color:var(--primary)}
  .srow .tick{color:var(--primary);font-size:12px}
  .cap{color:var(--muted);font-size:12px;margin:10px 0 0}
  .cap b{color:var(--fg);font-weight:600}
  .warn{color:var(--warn)}
</style>
</head>
<body>
<div class="wrap">
<h1>深度 · 可调 1–3</h1>
<div class="card">
  <div class="srow"><span class="t">深度</span><span class="val">2</span><span class="chev">›</span></div>
</div>
<div class="card">
  <div class="srow"><span class="t">1</span></div>
  <div class="srow sel"><span class="t">2</span><span class="tick">✓</span></div>
  <div class="srow"><span class="t">3</span></div>
</div>
<p class="cap">子代理也能拿到 <code>delegate</code>，再往下派一层。链上每一层各自写自己的结果行。</p>
<p class="cap"><span class="warn">这些必须一起定，不然开了就是坑：</span></p>
<p class="cap">1. 面板只列<b>直系</b>子代理，孙子挂在谁下面、点进去怎么回来；<br>
2. Stop 要不要<b>整条链</b>一起停；<br>
3. 谁等谁：父在 <code>await_job</code> 等子、子又在等孙，孙失败时错误回到<b>哪一层</b>；<br>
4. 3 层各自一个上下文，一次委托的 token 是现在的<b>三倍</b>；<br>
5. 提权策略沿链是<b>继承</b>还是各自可改。</p>
</div>
</body>
</html>
